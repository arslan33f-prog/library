<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Library Manager</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#1f2430;--mut:#6b7280;--ac:#1d5c4a;--acx:#fff;--bd:#dcd7cb;--red:#b3261e;--ok:#1d5c4a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--card:#1f242c;--tx:#eceae4;--mut:#9aa3ae;--ac:#5fc2a2;--acx:#10231c;--bd:#323a45;--red:#ff8a80;--ok:#5fc2a2}}
:root[data-theme="dark"]{--bg:#15181d;--card:#1f242c;--tx:#eceae4;--mut:#9aa3ae;--ac:#5fc2a2;--acx:#10231c;--bd:#323a45;--red:#ff8a80;--ok:#5fc2a2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:0 0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{flex:1;min-width:110px}
button,input,select{font:inherit}
button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p,.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button.d{color:var(--red);border-color:var(--red)}
input,select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mut);text-transform:uppercase}
.low{color:var(--red);font-weight:600}.ok{color:var(--ok);font-weight:600}
.msg{color:var(--mut);font-size:13px;margin:6px 0 0}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sum div{flex:1;min-width:120px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.sum b{display:block;font-size:22px}
.hide{display:none}
@media print{body{background:#fff;color:#000}.tabs,.noprint,button,.card form{display:none!important}.card{border:0;padding:0}th,td{border-bottom:1px solid #999;color:#000}.pv{display:block!important}}
</style></head><body><div class="wrap">
<h1>Library Manager</h1>
<div class="noprint" style="margin-bottom:10px"><button id="exp">Backup (download)</button> <button id="imp">Restore backup</button><input type="file" id="impf" accept=".json" class="hide"></div>
<div id="err" class="card hide"></div>
<div class="sum" id="sum"></div>
<div class="tabs noprint" id="tabs">
<button data-t="books" class="on">Books &amp; Stock</button>
<button data-t="issue">Issue / Return</button>
<button data-t="students">Student Report</button>
</div>

<section id="t-books">
<div class="card noprint"><h2>Add book / copy</h2>
<div class="row">
<div><label>Type</label><select id="bt"><option value="Book">Book</option><option value="Copy">Copy (notebook)</option></select></div>
<div><label>Name</label><input id="bn" list="bl" placeholder="e.g. Physics Class 10 / Long Copy 200 pages"></div>
<div><label>Author</label><input id="ba" placeholder="optional"></div>
<div><label>Copies</label><input id="bc" type="number" min="1" value="1"></div>
<div><button class="p" id="addb">Add</button></div></div>
<datalist id="bl"></datalist>
<p class="msg">Agar yehi naam pehle se hai to uski copies barh jayengi (stock add).</p></div>
<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px"><h2 style="margin:0">Books &amp; Copies list</h2><button class="noprint" onclick="window.print()">Print</button></div>
<div class="tw"><table><thead><tr><th>#</th><th>Name</th><th>Type</th><th>Author</th><th>Total</th><th>Issued</th><th>In hand</th><th class="noprint"></th></tr></thead><tbody id="bb"></tbody></table></div></div>
</section>

<section id="t-issue" class="hide">
<div class="card noprint"><h2>Issue book to student</h2>
<div class="row">
<div><label>Student name</label><input id="sn" list="sl"></div>
<div><label>Roll no / Class</label><input id="sr"></div>
<div><label>Book / Copy</label><select id="sb"></select></div>
<div><label>Copies</label><input id="sq" type="number" min="1" value="1"></div>
<div><button class="p" id="iss">Issue</button></div></div>
<datalist id="sl"></datalist><p class="msg" id="im"></p></div>
<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px"><h2 style="margin:0">Issue register</h2><button class="noprint" onclick="window.print()">Print</button></div>
<div class="tw"><table><thead><tr><th>Date</th><th>Student</th><th>Roll</th><th>Book</th><th>Qty</th><th>Status</th><th class="noprint"></th></tr></thead><tbody id="ib"></tbody></table></div></div>
</section>

<section id="t-students" class="hide">
<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px"><h2 style="margin:0">Student-wise books</h2><button class="noprint" onclick="window.print()">Print</button></div>
<div class="noprint" style="margin-bottom:10px"><input id="q" placeholder="Search student name..."></div>
<div class="tw"><table><thead><tr><th>Student</th><th>Roll</th><th>Currently holding</th><th>Total issued</th><th>Returned</th></tr></thead><tbody id="sb2"></tbody></table></div></div>
</section>
</div>
<script>
(function(){
var books=[],issues=[],db=null;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s||"").trim().toLowerCase().replace(/\s+/g," ")}
function today(){return new Date().toISOString().slice(0,10)}
function out(b){return issues.filter(function(i){return i.bookId===b.id&&!i.returned}).reduce(function(a,i){return a+(+i.qty||0)},0)}
function show(t){["books","issue","students"].forEach(function(x){$("t-"+x).classList.toggle("hide",x!==t)});
document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t)})}
$("tabs").onclick=function(e){if(e.target.dataset.t)show(e.target.dataset.t)};
function render(){
var tot=0,iss=0;
books.sort(function(a,b){return (a.title||"").localeCompare(b.title||"")});
$("bb").innerHTML=books.map(function(b,n){var o=out(b),h=(+b.total||0)-o;tot+=+b.total||0;iss+=o;
return "<tr><td>"+(n+1)+"</td><td>"+esc(b.title)+"</td><td>"+esc(b.type||"Book")+"</td><td>"+esc(b.author)+"</td><td>"+b.total+"</td><td>"+o+"</td><td class='"+(h<=0?"low":"ok")+"'>"+h+"</td><td class='noprint'><button data-add='"+b.id+"'>+ Copies</button> <button class='d' data-del='"+b.id+"'>Delete</button></td></tr>"}).join("")||"<tr><td colspan='8'>Abhi koi book ya copy nahi.</td></tr>";
$("sum").innerHTML="<div><b>"+books.length+"</b>Titles</div><div><b>"+tot+"</b>Total copies</div><div><b>"+iss+"</b>Issued</div><div><b>"+(tot-iss)+"</b>Stock in hand</div>";
$("bl").innerHTML=books.map(function(b){return "<option value=\""+esc(b.title)+"\">"}).join("");
var cur=$("sb").value;
$("sb").innerHTML=books.map(function(b){var h=(+b.total||0)-out(b);return "<option value='"+b.id+"'"+(h<=0?" disabled":"")+">"+esc(b.title)+" ["+(b.type||"Book")+"] (in hand: "+h+")</option>"}).join("");
if(cur)$("sb").value=cur;
var names={};issues.forEach(function(i){names[i.student]=1});
$("sl").innerHTML=Object.keys(names).map(function(n){return "<option value=\""+esc(n)+"\">"}).join("");
var li=issues.slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"")||(b.ts||0)-(a.ts||0)});
$("ib").innerHTML=li.map(function(i){return "<tr><td>"+esc(i.date)+"</td><td>"+esc(i.student)+"</td><td>"+esc(i.roll)+"</td><td>"+esc(i.bookTitle)+"</td><td>"+i.qty+"</td><td>"+(i.returned?"Returned "+esc(i.returnDate):"<span class='low'>Issued</span>")+"</td><td class='noprint'>"+(i.returned?"":"<button data-ret='"+i.id+"'>Return</button> ")+"<button class='d' data-di='"+i.id+"'>X</button></td></tr>"}).join("")||"<tr><td colspan='7'>Koi issue record nahi.</td></tr>";
var q=norm($("q").value),g={};
issues.forEach(function(i){var k=norm(i.student);if(q&&k.indexOf(q)<0)return;var s=g[k]||(g[k]={n:i.student,r:i.roll,hold:[],t:0,rt:0});
s.t+=+i.qty||0;if(i.returned)s.rt+=+i.qty||0;else s.hold.push(esc(i.bookTitle)+" x"+i.qty);if(i.roll)s.r=i.roll});
$("sb2").innerHTML=Object.keys(g).sort().map(function(k){var s=g[k];return "<tr><td>"+esc(s.n)+"</td><td>"+esc(s.r)+"</td><td style='white-space:normal'>"+(s.hold.join(", ")||"-")+"</td><td>"+s.t+"</td><td>"+s.rt+"</td></tr>"}).join("")||"<tr><td colspan='5'>Koi record nahi.</td></tr>";
}
var KEY="library_manager_data";
function LocalDB(){var store={},subs={};
try{store=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){fail(e)}Object.keys(subs).forEach(function(c){subs[c].forEach(function(f){f(snap(c))})})}
function snap(c){var o=store[c]||{};return{docs:Object.keys(o).map(function(id){return{id:id,data:function(){return o[id]}}})}}
return{collection:function(c){return{onSnapshot:function(f){(subs[c]=subs[c]||[]).push(f);f(snap(c))},add:async function(d){store[c]=store[c]||{};store[c][Date.now().toString(36)+Math.random().toString(36).slice(2,6)]=d;save()}}},
doc:function(p){var a=p.split("/");return{update:async function(d){Object.assign(store[a[0]][a[1]],d);save()},delete:async function(){delete store[a[0]][a[1]];save()}}}}}
$("exp").onclick=function(){var b=new Blob([localStorage.getItem(KEY)||"{}"],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="library-backup-"+today()+".json";a.click()};
$("imp").onclick=function(){$("impf").click()};
$("impf").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{JSON.parse(r.result);if(confirm("Maujooda data replace ho jayega. Continue?")){localStorage.setItem(KEY,r.result);location.reload()}}catch(e){alert("Ye valid backup file nahi hai.")}};r.readAsText(f)};
function fail(e){var d=$("err");d.classList.remove("hide");d.textContent="Error: "+(e&&e.message||e)}
async function init(){
db=LocalDB();
db.collection("books").onSnapshot(function(s){books=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});render()},fail);
db.collection("issues").onSnapshot(function(s){issues=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});render()},fail);
}
$("addb").onclick=async function(){
var t=$("bn").value.trim(),c=parseInt($("bc").value,10),ty=$("bt").value;
if(!t||!(c>0)||!db)return alert("Book name aur copies likhein.");
try{var ex=books.filter(function(b){return norm(b.title)===norm(t)&&(b.type||"Book")===ty})[0];
if(ex){await db.doc("books/"+ex.id).update({total:(+ex.total||0)+c})}
else{await db.collection("books").add({title:t,type:ty,author:$("ba").value.trim(),total:c,created:Date.now()})}
$("bn").value="";$("ba").value="";$("bc").value=1}catch(e){fail(e)}};
$("iss").onclick=async function(){
var n=$("sn").value.trim(),q=parseInt($("sq").value,10),b=books.filter(function(x){return x.id===$("sb").value})[0];
if(!n||!b||!(q>0)||!db)return alert("Student name, book aur copies chahiye.");
var h=(+b.total||0)-out(b);if(q>h)return alert("Stock kam hai. In hand: "+h);
try{await db.collection("issues").add({student:n,roll:$("sr").value.trim(),bookId:b.id,bookTitle:b.title,qty:q,date:today(),ts:Date.now(),returned:false});
$("im").textContent="Issued: "+n+" ko "+b.title+" x"+q;$("sq").value=1}catch(e){fail(e)}};
document.body.addEventListener("click",async function(e){
var t=e.target,id;if(!db)return;
try{
if(id=t.dataset.del){var b=books.filter(function(x){return x.id===id})[0];
if(out(b)>0)return alert("Is book ki copies abhi students ke paas hain. Pehle return karwayein.");
if(confirm("Delete \""+b.title+"\"?"))await db.doc("books/"+id).delete()}
else if(id=t.dataset.add){var n=parseInt(prompt("Kitni copies add karni hain?","1"),10);
var bk=books.filter(function(x){return x.id===id})[0];if(n>0)await db.doc("books/"+id).update({total:(+bk.total||0)+n})}
else if(id=t.dataset.ret){await db.doc("issues/"+id).update({returned:true,returnDate:today()})}
else if(id=t.dataset.di){if(confirm("Ye issue record delete karein?"))await db.doc("issues/"+id).delete()}
}catch(er){fail(er)}});
$("q").oninput=render;
render();init();
})();
</script></body></html>
